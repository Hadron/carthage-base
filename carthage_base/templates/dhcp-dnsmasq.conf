<%!

def attached_networks(model):
    return {link.net for link in model.network_links.values()}


def link_for_network(model, net):
    for link in model.network_links.values():
        if link.net is not net:
            continue
        if link.member_of and link.member_of_link.local_type != 'vpn':
            continue
        return link
    return None


%>\
<%def name="handle_host_records(net,tag)">\
%for l in net.network_links:
<%
if l.member_of: continue
v4 = l.merged_v4_config
if l.dns_name == "": continue
name = l.dns_name or l.machine.name
short_name = name.partition(".")[0]
%>\
%if v4.dhcp and v4.address and l.mac:
dhcp-host=set:${tag},${l.mac},${v4.address},${name},18h
%elif v4.dhcp and l.mac:
dhcp-host=set:${tag},${l.mac},${name},18h
%endif
%if v4.address:
host-record=${name},${short_name},${v4.address},${3600*18}
%endif
%endfor
</%def>\
<%def name="handle_network(net,link)">\
<%net.assign_addresses() %>\
<%interface = link.interface %>\
%if net.v4_config.dhcp_ranges:
%for l,h in net.v4_config.dhcp_ranges:
dhcp-range=set:${interface},${l},${h},10h
%endfor
%else:
dhcp-range=set:${link.interface},${net.v4_config.network[0]},static
%endif
%if net.v4_config.gateway:
dhcp-option=tag:${interface},option:router,${net.v4_config.gateway}
%endif
<%domains=net.v4_config.domains.split() if net.v4_config.domains else [] %>\
%for d in domains:
domain=${d.replace('~','')}
%if d == domains[0]:
local=/${d.replace('~','')}/
%endif
%endfor
<%
if isinstance(link.merged_v4_config.dns_servers, str):
    raise RuntimeError(f"dns_servers should be a sequence, not a string")
%>
%for server in link.merged_v4_config.dns_servers:
server=${server}
%endfor
${handle_host_records(net,interface)}\
</%def>\
<%def name="handle_served_network(net)">\
<%
net.assign_addresses()
if not net.v4_config.network:
    raise RuntimeError(
        f"Cannot provide DHCP service for unattached network {net.name}: "
        "its IPv4 network is not configured")
tag = net.name
netmask = net.v4_config.network.netmask
%>\
%if net.v4_config.dhcp_ranges:
%for l,h in net.v4_config.dhcp_ranges:
dhcp-range=set:${tag},${l},${h},${netmask},10h
%endfor
%else:
dhcp-range=set:${tag},${net.v4_config.network[0]},static,${netmask}
%endif
%if net.v4_config.gateway:
dhcp-option=tag:${tag},option:router,${net.v4_config.gateway}
%endif
<%domains=net.v4_config.domains.split() if net.v4_config.domains else [] %>\
%for d in domains:
domain=${d.replace('~','')}
%if d == domains[0]:
local=/${d.replace('~','')}/
%endif
%endfor
${handle_host_records(net,tag)}\
</%def>\
<%def name="handle_relay(net)">\
<%
link = link_for_network(model, net)
if link is None:
    raise RuntimeError(
        f"Cannot relay DHCP for unattached network {net.name}: dnsmasq "
        "requires a local address on a client-facing interface")
local_address = link.merged_v4_config.address
if not local_address:
    raise RuntimeError(
        f"Cannot relay DHCP for {net.name}: its attached link "
        f"{link.interface} has no IPv4 address")
%>\
dhcp-relay=${local_address},${model.relay_server}
</%def>\
<%def name="hash()">
## change this date to indicate the source has changed enough to regenerate the template
2026-09-14
relay-server ${model.relay_server or ""}
%if model.relay_server:
%for net in sorted(relay_networks, key=lambda n: n.name):
<%link = link_for_network(model, net) %>\
relay-network ${net.name} ${link.merged_v4_config.address if link else ""}
%endfor
%else:
%for net in sorted(served_networks, key=lambda n: n.name):
served-network ${net.name} ${net.v4_config}
%for link in sorted(net.network_links, key = lambda link: (link.machine.name, link.interface)):
<%if link.member_of: continue%>\
${link.interface} ${link.machine.name} ${link.mac} ${link.dns_name or ""} ${link.merged_v4_config.dhcp} ${link.merged_v4_config.address}
%endfor
%endfor
%endif
%for net in sorted(attached_networks(model), key = lambda n: n.name):
%for link in sorted(net.network_links, key = lambda link: (link.machine.name, link.interface)):
<%if link.member_of: continue%>\
${link.interface} ${link.machine.name} ${link.mac} ${link.dns_name or ""}
%endfor
%endfor
</%def>\

bind-dynamic

%if model.relay_server:
%for net in relay_networks:
${handle_relay(net)}\
%endfor
%else:
<%
nets = set()
for net in attached_networks(model):
    for link in model.network_links.values():
        if link.net is not net: continue
        if link.member_of and link.member_of_link.local_type != 'vpn': continue
        nets.add(net)
        handle_network(net, link)
        break
for net in served_networks:
    if net in nets: continue
    nets.add(net)
    handle_served_network(net)
%>\
%endif
